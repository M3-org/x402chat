<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto SuperChat Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              border: "hsl(214.3 31.8% 91.4%)",
              input: "hsl(214.3 31.8% 91.4%)",
              ring: "hsl(222.2 84% 4.9%)",
              background: "hsl(0 0% 100%)",
              foreground: "hsl(222.2 84% 4.9%)",
              primary: {
                DEFAULT: "hsl(222.2 47.4% 11.2%)",
                foreground: "hsl(210 40% 98%)",
              },
              secondary: {
                DEFAULT: "hsl(210 40% 96%)",
                foreground: "hsl(222.2 84% 4.9%)",
              },
              destructive: {
                DEFAULT: "hsl(0 84.2% 60.2%)",
                foreground: "hsl(210 40% 98%)",
              },
              muted: {
                DEFAULT: "hsl(210 40% 96%)",
                foreground: "hsl(215.4 16.3% 46.9%)",
              },
              accent: {
                DEFAULT: "hsl(210 40% 96%)",
                foreground: "hsl(222.2 84% 4.9%)",
              },
              popover: {
                DEFAULT: "hsl(0 0% 100%)",
                foreground: "hsl(222.2 84% 4.9%)",
              },
              card: {
                DEFAULT: "hsl(0 0% 100%)",
                foreground: "hsl(222.2 84% 4.9%)",
              },
            },
          },
        },
      };
    </script>
    <style>
      .tab-active {
        border-bottom: 2px solid #10b981;
        color: #10b981;
      }

      .sort-button:hover {
        background-color: rgba(255, 255, 255, 0.1);
      }

      .sort-asc::after {
        content: " ↑";
      }
      .sort-desc::after {
        content: " ↓";
      }
    </style>
  </head>
  <body class="dark bg-gray-900 text-white min-h-screen">
    <div class="container mx-auto p-6 max-w-7xl">
      <!-- Header -->
      <div class="flex justify-between items-center mb-6">
        <div>
          <h1 class="text-3xl font-bold">🛡️ SuperChat Dashboard</h1>
          <div id="syncStatus" class="text-sm text-gray-400 mt-1">
            Last sync: Never
          </div>
        </div>
        <div class="flex items-center gap-4">
          <button
            onclick="dashboard.openOverlay()"
            class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-md transition-colors"
          >
            🎥 Open Overlay
          </button>
          <button
            onclick="dashboard.syncPendingDonations()"
            class="bg-gray-600 hover:bg-gray-700 text-white px-4 py-2 rounded-md transition-colors"
            id="syncBtn"
          >
            🔄 Sync
          </button>
          <div
            id="status"
            class="px-3 py-1 rounded-full text-sm bg-red-500 text-white"
          >
            Connecting...
          </div>
        </div>
      </div>

      <!-- Tabs -->
      <div class="border-b border-gray-700 mb-6">
        <nav class="flex space-x-8">
          <button
            onclick="dashboard.switchTab('pending')"
            class="py-2 px-1 border-b-2 font-medium text-sm tab-active"
            id="tab-pending"
          >
            Pending (<span id="pendingCount">0</span>)
          </button>
          <button
            onclick="dashboard.switchTab('approved')"
            class="py-2 px-1 border-b-2 border-transparent font-medium text-sm text-gray-400 hover:text-gray-300"
            id="tab-approved"
          >
            Approved (<span id="approvedCount">0</span>)
          </button>
          <button
            onclick="dashboard.switchTab('rejected')"
            class="py-2 px-1 border-b-2 border-transparent font-medium text-sm text-gray-400 hover:text-gray-300"
            id="tab-rejected"
          >
            Rejected (<span id="rejectedCount">0</span>)
          </button>
        </nav>
      </div>

      <!-- Table -->
      <div class="bg-gray-800 rounded-lg border border-gray-700">
        <div class="overflow-x-auto">
          <table class="w-full">
            <thead class="bg-gray-700">
              <tr>
                <th class="p-0">
                  <button
                    onclick="dashboard.sortBy('timestamp')"
                    class="sort-button w-full h-full px-4 py-3 text-left text-sm font-medium hover:bg-gray-600 transition-colors"
                  >
                    Time
                  </button>
                </th>
                <th class="p-0">
                  <button
                    onclick="dashboard.sortBy('token_symbol')"
                    class="sort-button w-full h-full px-4 py-3 text-left text-sm font-medium hover:bg-gray-600 transition-colors"
                  >
                    Token
                  </button>
                </th>
                <th class="p-0">
                  <button
                    onclick="dashboard.sortBy('amount')"
                    class="sort-button w-full h-full px-4 py-3 text-left text-sm font-medium hover:bg-gray-600 transition-colors"
                  >
                    Amount
                  </button>
                </th>
                <th class="p-0">
                  <button
                    onclick="dashboard.sortBy('memo')"
                    class="sort-button w-full h-full px-4 py-3 text-left text-sm font-medium hover:bg-gray-600 transition-colors"
                  >
                    Message
                  </button>
                </th>
                <th class="p-0">
                  <button
                    onclick="dashboard.sortBy('sender')"
                    class="sort-button w-full h-full px-4 py-3 text-left text-sm font-medium hover:bg-gray-600 transition-colors"
                  >
                    Sender
                  </button>
                </th>
                <th class="px-4 py-3 text-left">Actions</th>
              </tr>
            </thead>
            <tbody id="donationsTable" class="divide-y divide-gray-700">
              <tr>
                <td colspan="6" class="px-4 py-8 text-center text-gray-400">
                  No donations to show
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <script>
      class ModerationDashboard {
        constructor() {
          this.ws = null;
          this.status = document.getElementById("status");
          this.donationsTable = document.getElementById(
            "donationsTable",
          );
          this.pendingCount = document.getElementById("pendingCount");
          this.approvedCount = document.getElementById("approvedCount");
          this.rejectedCount = document.getElementById("rejectedCount");
          this.syncStatus = document.getElementById("syncStatus");

          this.currentTab = "pending";
          this.donations = { pending: [], approved: [], rejected: [] };
          this.sortField = "timestamp";
          this.sortOrder = "desc";

          this.connect();
          this.loadAllData();
        }

        connect() {
          const wsUrl = `ws://${window.location.host}/ws/dashboard`;
          this.ws = new WebSocket(wsUrl);

          this.ws.onopen = () => {
            console.log("✅ Dashboard connected");
            this.status.textContent = "Connected";
            this.status.className =
              "px-3 py-1 rounded-full text-sm bg-green-500 text-white";
          };

          this.ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            if (data.type === "new_donation") {
              this.donations.pending.unshift(data.data);
              this.updateTabCounts();
              if (this.currentTab === "pending") {
                this.renderTable();
              }
            }
          };

          this.ws.onclose = () => {
            console.log("❌ Dashboard disconnected");
            this.status.textContent = "Disconnected";
            this.status.className =
              "px-3 py-1 rounded-full text-sm bg-red-500 text-white";
            setTimeout(() => this.connect(), 3000);
          };
        }

        async loadAllData() {
          await Promise.all([
            this.loadDonationsByStatus("pending"),
            this.loadDonationsByStatus("approved"),
            this.loadDonationsByStatus("rejected"),
            this.loadSyncStatus(),
          ]);
          this.updateTabCounts();
          this.renderTable();
        }

        async loadDonationsByStatus(status) {
          try {
            let url;
            switch (status) {
              case "pending":
                url = "/api/events/pending";
                break;
              case "approved":
                url = "/api/events/approved/today";
                break;
              case "rejected":
                url = "/api/events/rejected/today";
                break;
            }
            const response = await fetch(url);
            this.donations[status] = await response.json();
          } catch (error) {
            console.error(`Failed to load ${status} donations:`, error);
            this.donations[status] = [];
          }
        }

        updateTabCounts() {
          this.pendingCount.textContent = this.donations.pending.length;
          this.approvedCount.textContent =
            this.donations.approved.length;
          this.rejectedCount.textContent =
            this.donations.rejected.length;
        }

        switchTab(tab) {
          this.currentTab = tab;

          // Update tab styling
          document.querySelectorAll('[id^="tab-"]').forEach((t) => {
            t.className =
              "py-2 px-1 border-b-2 border-transparent font-medium text-sm text-gray-400 hover:text-gray-300";
          });
          document.getElementById(`tab-${tab}`).className =
            "py-2 px-1 border-b-2 font-medium text-sm tab-active";

          this.renderTable();
        }

        sortBy(field) {
          if (this.sortField === field) {
            this.sortOrder = this.sortOrder === "asc" ? "desc" : "asc";
          } else {
            this.sortField = field;
            this.sortOrder = "desc";
          }

          // Update sort indicators
          document.querySelectorAll(".sort-button").forEach((btn) => {
            btn.className =
              "sort-button w-full h-full px-4 py-3 text-left text-sm font-medium hover:bg-gray-600 transition-colors";
          });

          const currentBtn = document.querySelector(
            `[onclick="dashboard.sortBy('${field}')"]`,
          );
          currentBtn.className += ` sort-${this.sortOrder}`;

          this.renderTable();
        }

        renderTable() {
          const donations = [...this.donations[this.currentTab]];

          // Sort donations
          donations.sort((a, b) => {
            let aVal = a[this.sortField];
            let bVal = b[this.sortField];

            // Handle different data types
            if (this.sortField === "amount") {
              aVal = parseFloat(aVal) || 0;
              bVal = parseFloat(bVal) || 0;
            } else if (this.sortField === "timestamp") {
              aVal = parseInt(aVal) || 0;
              bVal = parseInt(bVal) || 0;
            } else {
              // String fields (memo, sender, token_symbol)
              aVal = (aVal || "").toString().toLowerCase();
              bVal = (bVal || "").toString().toLowerCase();
            }

            if (this.sortOrder === "asc") {
              return aVal > bVal ? 1 : -1;
            } else {
              return aVal < bVal ? 1 : -1;
            }
          });

          if (donations.length === 0) {
            this.donationsTable.innerHTML = `
                        <tr><td colspan="6" class="px-4 py-8 text-center text-gray-400">No ${this.currentTab} donations</td></tr>
                    `;
            return;
          }

          this.donationsTable.innerHTML = donations.map((donation) => `
                    <tr class="hover:bg-gray-700 ${
            donation.status === "playing"
              ? "bg-green-900 bg-opacity-30"
              : ""
          }">
                        <td class="px-4 py-3 text-sm">${
            this.formatTime(donation.timestamp)
          }</td>
                        <td class="px-4 py-3 text-sm font-medium text-green-400">${donation.token_symbol}</td>
                        <td class="px-4 py-3 text-sm font-mono">${
            parseFloat(donation.amount).toFixed(2)
          }</td>
                        <td class="px-4 py-3 text-sm max-w-xs truncate">${
            donation.memo ||
            '<span class="text-gray-500">No memo</span>'
          }${
            donation.status === "playing"
              ? ' <span class="text-green-400">📺</span>'
              : ""
          }</td>
                        <td class="px-4 py-3 text-sm font-mono">${
            this.truncateAddress(donation.sender)
          }</td>
                        <td class="px-4 py-3 text-sm">
                            ${
            this.currentTab === "pending"
              ? `
                                <div class="flex gap-2">
                                    <button onclick="dashboard.approveDonation('${donation.signature}')" 
                                            class="approve-btn-${donation.signature} bg-green-600 hover:bg-green-700 text-white px-3 py-1 rounded text-xs transition-colors">
                                        ${
                donation.status === "playing" ? "⏹️ Finish" : "▶️ Play"
              }
                                    </button>
                                    <button onclick="dashboard.rejectDonation('${donation.signature}')" 
                                            class="bg-gray-600 hover:bg-gray-700 text-white px-3 py-1 rounded text-xs transition-colors">
                                        ⏭️ Skip
                                    </button>
                                </div>
                            `
              : `<span class="text-gray-500 capitalize">${this.currentTab}</span>`
          }
                        </td>
                    </tr>
                `).join("");
        }

        formatTime(timestamp) {
          return new Date(timestamp * 1000).toLocaleString("en-US", {
            month: "short",
            day: "numeric",
            hour: "2-digit",
            minute: "2-digit",
          });
        }

        truncateAddress(address) {
          if (!address || address.length < 12) return address;
          return `${address.slice(0, 6)}...${address.slice(-4)}`;
        }

        async approveDonation(signature) {
          const donation = this.donations.pending.find((d) =>
            d.signature === signature
          );
          if (!donation) return;

          if (donation.status === "playing") {
            // Second click: Approve and move to approved tab
            try {
              const response = await fetch("/api/events/approve", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ signature }),
              });

              if (response.ok) {
                // Move from pending to approved
                this.donations.pending = this.donations.pending.filter(
                  (d) => d.signature !== signature,
                );
                donation.status = "approved";
                this.donations.approved.unshift(donation);
                this.updateTabCounts();
                this.renderTable();
              }
            } catch (error) {
              console.error("Error approving donation:", error);
            }
          } else {
            // First click: Start playing
            try {
              const response = await fetch("/api/events/play", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ signature }),
              });

              if (response.ok) {
                // Mark as playing (client-side state)
                donation.status = "playing";
                this.renderTable();
              }
            } catch (error) {
              console.error("Error starting donation:", error);
            }
          }
        }

        async rejectDonation(signature) {
          try {
            const response = await fetch("/api/events/reject", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ signature }),
            });

            if (response.ok) {
              // Move from pending to rejected
              const donation = this.donations.pending.find((d) =>
                d.signature === signature
              );
              if (donation) {
                this.donations.pending = this.donations.pending.filter(
                  (d) => d.signature !== signature,
                );
                donation.status = "rejected";
                this.donations.rejected.unshift(donation);
                this.updateTabCounts();
                this.renderTable();
              }
            }
          } catch (error) {
            console.error("Error rejecting donation:", error);
          }
        }

        openOverlay() {
          window.open(
            "/",
            "overlay",
            "width=800,height=600,scrollbars=no,resizable=yes",
          );
        }

        async loadSyncStatus() {
          try {
            const response = await fetch("/api/sync/status");
            const status = await response.json();

            if (status.syncing) {
              this.syncStatus.textContent = "Syncing blockchain...";
              this.syncStatus.className = "text-sm text-green-400 mt-1";
            } else if (status.last_sync) {
              const timeAgo = this.timeAgo(new Date(status.last_sync));
              this.syncStatus.textContent = `Last sync: ${timeAgo}`;
              this.syncStatus.className = "text-sm text-gray-400 mt-1";
            } else {
              this.syncStatus.textContent = "Last sync: Never";
              this.syncStatus.className = "text-sm text-gray-400 mt-1";
            }
          } catch (error) {
            console.error("Failed to load sync status:", error);
          }
        }

        timeAgo(date) {
          const now = new Date();
          const diffMs = now - date;
          const diffMins = Math.floor(diffMs / 60000);

          if (diffMins < 1) return "Just now";
          if (diffMins < 60) return `${diffMins}m ago`;
          const diffHours = Math.floor(diffMins / 60);
          if (diffHours < 24) return `${diffHours}h ago`;
          const diffDays = Math.floor(diffHours / 24);
          return `${diffDays}d ago`;
        }

        async syncPendingDonations() {
          const syncBtn = document.getElementById("syncBtn");
          const originalText = syncBtn.innerHTML;

          try {
            syncBtn.innerHTML = "⏳ Syncing...";
            syncBtn.disabled = true;
            this.syncStatus.textContent = "Syncing blockchain...";
            this.syncStatus.className = "text-sm text-green-400 mt-1";

            const syncResponse = await fetch("/api/sync", {
              method: "POST",
            });
            const syncResult = await syncResponse.json();

            if (!syncResponse.ok) {
              throw new Error(syncResult.detail || "Sync failed");
            }

            syncBtn.innerHTML = `✅ Found ${syncResult.new_donations}`;

            // Reload all data
            await this.loadAllData();

            setTimeout(() => {
              syncBtn.innerHTML = originalText;
              syncBtn.disabled = false;
            }, 3000);
          } catch (error) {
            console.error("Sync failed:", error);
            syncBtn.innerHTML = "❌ Failed";
            this.syncStatus.textContent =
              `Sync failed: ${error.message}`;
            this.syncStatus.className = "text-sm text-red-400 mt-1";

            setTimeout(() => {
              syncBtn.innerHTML = originalText;
              syncBtn.disabled = false;
              this.loadSyncStatus();
            }, 3000);
          }
        }
      }

      // Global dashboard instance
      let dashboard;
      window.addEventListener("DOMContentLoaded", () => {
        dashboard = new ModerationDashboard();
      });
    </script>
  </body>
</html>
