<!DOCTYPE html>
<html data-theme="dark">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>x402 Chat / Donate</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/global.css">
  <link rel="stylesheet" href="/donate.css">
  <script type="module" src="/donate.js"></script>
  <script>
    // Interactive cursor glow effect
    document.addEventListener('DOMContentLoaded', () => {
      const glow = document.getElementById('cursorGlow');
      let mouseX = 0, mouseY = 0;

      document.addEventListener('mousemove', (e) => {
        mouseX = e.clientX;
        mouseY = e.clientY;
        glow.style.left = mouseX + 'px';
        glow.style.top = mouseY + 'px';
        glow.style.opacity = '1';
      });

      document.addEventListener('mouseleave', () => {
        glow.style.opacity = '0';
      });
    });
  </script>
</head>

<body>
  <div class="cursor-glow" id="cursorGlow"></div>
  <div class="container-lg">
    <main>
      <div class="donate-island">
        <h1 id="pageTitle">x402 Chat</h1>
        <p class="muted">Send a USDC super-chat on Solana</p>

        <form>
          <div class="row">
            <input id="senderName" title="Name" maxlength="12" placeholder="Name (max 12)" required />
            <div class="input-cell dollar-input">
              <input id="amount" title="USDC Amount" type="number" min="0.01" step="0.01" value="1.00" />
            </div>
          </div>

          <textarea id="message" title="Message" maxlength="200" rows="3"
            placeholder="Your message (max 200)"></textarea>

          <button type="submit" class="btn-primary">Pay with Phantom</button>
        </form>

        <div class="status-messages">
          <p id="status" class="muted"></p>
          <p id="success" class="ok hidden"></p>
          <p id="error" class="err hidden"></p>
        </div>
      </div>

      <!-- Privacy Check Tool (below tipping form) -->
      <div class="privacy-check-section">
        <h3>🔒 Privacy Check</h3>
        <p class="muted">Check wallet privacy before tipping</p>

        <div class="row">
          <input id="walletAddressCheck" type="text" placeholder="Enter wallet address"
            pattern="[1-9A-HJ-NP-Za-km-z]{32,44}" />
          <button type="button" id="checkWalletBtn" class="btn-secondary">Check</button>
        </div>
      </div>

      <div id="privacyScoreCard" class="hidden"></div>
    </main>

    <footer>
      <p class="muted">Powered by <a href="/">x402 Chat</a></p>
    </footer>
  </div>
</body>

</html>
